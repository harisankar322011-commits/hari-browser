version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
