name: Build Hari Browser Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hari-browser-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build and validate debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run repository security smoke checks
        run: python3 tools/security_smoke_test.py

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build debug APK and run lint
        run: ./gradlew --no-daemon clean assembleDebug lint

      - name: Validate debug APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          application_id="$(apkanalyzer manifest application-id "$apk")"
          test "$application_id" = "com.haricalcx.haribrowser.debug"
          debuggable="$(apkanalyzer manifest debuggable "$apk")"
          test "$debuggable" = "true"
          unzip -tq "$apk"
          mapfile -t dex_entries < <(unzip -Z1 "$apk" | grep -E '^classes[0-9]*\.dex$')
          test "${#dex_entries[@]}" -gt 0
          dex_tmp="$RUNNER_TEMP/hari-browser-debug-dex.tmp"
          for dex_entry in "${dex_entries[@]}"; do
            unzip -p "$apk" "$dex_entry" > "$dex_tmp"
            if grep -aFq 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' "$dex_tmp"; then
              rm -f "$dex_tmp"
              echo "::error::Debug APK still embeds the standard AV test pattern in $dex_entry."
              exit 1
            fi
          done
          rm -f "$dex_tmp"
          echo "Debug APK size: $(stat -c '%s' "$apk") bytes"
          mkdir -p dist
          cp "$apk" dist/HariBrowser-2.4.0-debug.apk
          sha256sum dist/HariBrowser-2.4.0-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hari-browser-2.4.0-debug-apk
          path: dist/HariBrowser-2.4.0-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
