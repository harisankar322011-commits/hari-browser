name: Build Hari Browser Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hari-browser-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build and validate debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run repository security smoke checks
        run: python3 tools/security_smoke_test.py

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Build debug APK and run lint
        run: gradle --no-daemon clean assembleDebug lint

      - name: Validate debug APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          application_id="$(apkanalyzer manifest application-id "$apk")"
          test "$application_id" = "com.haricalcx.haribrowser"
          debuggable="$(apkanalyzer manifest debuggable "$apk")"
          test "$debuggable" = "true"
          unzip -tq "$apk"
          echo "Debug APK size: $(stat -c '%s' "$apk") bytes"
          mkdir -p dist
          cp "$apk" dist/HariBrowser-2.1.0-debug.apk
          sha256sum dist/HariBrowser-2.1.0-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hari-browser-2.1.0-debug-apk
          path: dist/HariBrowser-2.1.0-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
