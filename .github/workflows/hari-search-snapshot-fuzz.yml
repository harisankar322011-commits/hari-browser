name: HARI Search Snapshot Fuzz Smoke

on:
  push:
    paths:
      - "rust/hari_search/**"
      - ".github/workflows/hari-search-snapshot-fuzz.yml"
  pull_request:
    paths:
      - "rust/hari_search/**"
      - ".github/workflows/hari-search-snapshot-fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hari-search-snapshot-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-fuzz:
    name: Bounded snapshot decoder fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action revision
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz snapshot decoder with bounded input
        run: cargo fuzz run --fuzz-dir=rust/hari_search/fuzz snapshot_decode -- -max_total_time=30 -max_len=16384
