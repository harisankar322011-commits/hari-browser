name: HARI Search Core

on:
  push:
    branches: [main]
    paths:
      - "rust/hari_search/**"
      - ".github/workflows/hari-search-core.yml"
  pull_request:
    branches: [main]
    paths:
      - "rust/hari_search/**"
      - ".github/workflows/hari-search-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hari-search-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, test, and lint HARI Search
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path rust/hari_search/Cargo.toml -- --check

      - name: Run tests
        run: cargo test --manifest-path rust/hari_search/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path rust/hari_search/Cargo.toml --all-targets -- -D warnings
