name: HARI Engine Fuzz Smoke

on:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/hari-engine-fuzz.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/hari-engine-fuzz.yml"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-parser-fuzz:
    name: Coverage-guided HTML parser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action revision
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz HTML parser with bounded input
        working-directory: engine/fuzz
        run: cargo fuzz run html_parser -- -max_total_time=30 -max_len=16384
