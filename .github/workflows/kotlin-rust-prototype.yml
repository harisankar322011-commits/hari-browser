name: Kotlin and Rust integration prototype

on:
  push:
    branches:
      - main
      - engineering/kotlin-rust-integration-2026-10-25
      - security/strict-url-guard-2026-10-25
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-rust-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test Kotlin and build Rust Android library
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt, clippy

      - name: Run Rust tests and formatting checks
        run: |
          cargo fmt --manifest-path rust/hari_url_guard/Cargo.toml -- --check
          cargo test --manifest-path rust/hari_url_guard/Cargo.toml
          cargo clippy --manifest-path rust/hari_url_guard/Cargo.toml -- -D warnings

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Set explicit Android NDK path
        run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Run Kotlin tests, native Android build, APK assembly, and lint
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug lint -PenableRustNativeBuild=true

      - name: Verify native libraries are packaged
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libhari_url_guard.so"
          done
          unzip -tq "$apk"
