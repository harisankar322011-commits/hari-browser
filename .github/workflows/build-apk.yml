name: Build Hari Browser APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate each revision so a stalled older build cannot block the newest APK.
  group: hari-browser-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          # Avoid the separately licensed enhanced cache; use the open-source MIT cache provider.
          cache-provider: basic

      - name: Build debug and release APKs and run lint
        run: gradle --no-daemon clean assembleDebug assembleRelease lint

      - name: Verify debug APK exceeds 10 MiB
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk" || { echo "::error::Debug APK was not created."; exit 1; }
          bytes="$(stat -c '%s' "$apk")"
          echo "Debug APK size: $bytes bytes ($((bytes / 1048576)) MiB)"
          if [ "$bytes" -le 10485760 ]; then
            echo "::error::Debug APK must be larger than 10 MiB; got $bytes bytes."
            exit 1
          fi

      - name: Verify release APK was produced
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$apk" || { echo "::error::Release APK was not created."; exit 1; }
          bytes="$(stat -c '%s' "$apk")"
          echo "Release APK size: $bytes bytes ($((bytes / 1048576)) MiB)"
          echo "Release APK is unsigned; F-Droid builds and signs its own package."

      - name: Publish debug and release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hari-browser-android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
