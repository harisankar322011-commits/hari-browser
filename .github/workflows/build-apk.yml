name: Build Hari Browser Release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hari-browser-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run repository security smoke checks
        run: python3 tools/security_smoke_test.py

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Build only the release variant and run lint
        run: gradle --no-daemon clean assembleRelease testDebugUnitTest lint

      - name: Validate release APK and package manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$apk" || { echo "::error::Release APK was not created."; exit 1; }
          application_id="$(apkanalyzer manifest application-id "$apk")"
          test "$application_id" = "com.haricalcx.haribrowser" || {
            echo "::error::Unexpected application ID: $application_id"; exit 1;
          }
          debuggable="$(apkanalyzer manifest debuggable "$apk")"
          test "$debuggable" = "false" || {
            echo "::error::Release APK must not be debuggable (reported: $debuggable)."; exit 1;
          }
          permissions="$(apkanalyzer manifest permissions "$apk" | sed '/^[[:space:]]*$/d' | sort -u)"
          expected_permissions="$(printf '%s\n' \
            'android.permission.INTERNET' \
            'com.haricalcx.haribrowser.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION')"
          if [ "$permissions" != "$expected_permissions" ]; then
            echo "::error::Unexpected permissions in release APK:"
            printf '%s\n' "$permissions"
            exit 1
          fi
          unzip -tq "$apk"
          # The original APK contained the standard harmless AV test pattern in DEX. Guard release output against regressions.
          dex_tmp="$RUNNER_TEMP/hari-browser-classes.dex"
          unzip -p "$apk" classes.dex > "$dex_tmp"
          if grep -aFq 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' "$dex_tmp"; then
            rm -f "$dex_tmp"
            echo "::error::Release APK still embeds the standard AV test pattern in classes.dex."
            exit 1
          fi
          rm -f "$dex_tmp"
          bytes="$(stat -c '%s' "$apk")"
          echo "Release APK size: $bytes bytes ($((bytes / 1048576)) MiB)"
          if [ "$bytes" -le 10485760 ]; then
            echo "::error::Release APK must exceed 10 MiB; got $bytes bytes."
            exit 1
          fi

      # Pull requests get a separate installable debug APK for owner-only device testing.
      # It is never included in the release artifact or published from main.
      - name: Build installable debug APK for pull-request testing
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon assembleDebug

      - name: Validate debug APK for pull-request testing
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk" || { echo "::error::Debug APK was not created."; exit 1; }
          application_id="$(apkanalyzer manifest application-id "$apk")"
          test "$application_id" = "com.haricalcx.haribrowser.debug" || {
            echo "::error::Unexpected debug application ID: $application_id"; exit 1;
          }
          debuggable="$(apkanalyzer manifest debuggable "$apk")"
          test "$debuggable" = "true" || {
            echo "::error::Test APK must be debuggable (reported: $debuggable)."; exit 1;
          }
          unzip -tq "$apk"
          # Apply the same package-content guard to the installable PR debug APK.
          dex_tmp="$RUNNER_TEMP/hari-browser-classes.dex"
          unzip -p "$apk" classes.dex > "$dex_tmp"
          if grep -aFq 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' "$dex_tmp"; then
            rm -f "$dex_tmp"
            echo "::error::Debug APK still embeds the standard AV test pattern in classes.dex."
            exit 1
          fi
          rm -f "$dex_tmp"
          echo "Installable debug APK validated for device testing."

      - name: Upload installable debug APK for pull-request testing
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hari-browser-2.3.0-debug-pr-${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # Stable release signing uses the four protected HARI_RELEASE_* repository secrets.
      # CI must never generate/discard a signing key; without a stable key, publish unsigned validation only.
      - name: Sign release with stable key or stage unsigned validation APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          HARI_RELEASE_KEYSTORE_BASE64: ${{ secrets.HARI_RELEASE_KEYSTORE_BASE64 }}
          HARI_RELEASE_KEY_ALIAS: ${{ secrets.HARI_RELEASE_KEY_ALIAS }}
          HARI_RELEASE_KEY_PASSWORD: ${{ secrets.HARI_RELEASE_KEY_PASSWORD }}
          HARI_RELEASE_STORE_PASSWORD: ${{ secrets.HARI_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p dist
          if [ -n "$HARI_RELEASE_KEYSTORE_BASE64" ] && [ -n "$HARI_RELEASE_KEY_ALIAS" ] \
             && [ -n "$HARI_RELEASE_KEY_PASSWORD" ] && [ -n "$HARI_RELEASE_STORE_PASSWORD" ]; then
            keystore="$RUNNER_TEMP/hari-browser-release.jks"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$HARI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            test -s "$keystore"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$HARI_RELEASE_KEY_ALIAS" \
              --ks-pass env:HARI_RELEASE_STORE_PASSWORD \
              --key-pass env:HARI_RELEASE_KEY_PASSWORD \
              --out "dist/HariBrowser-2.3.0.apk" "$unsigned"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/HariBrowser-2.3.0.apk"
            echo "### Release signing: signed with the configured stable key" >> "$GITHUB_STEP_SUMMARY"
            publish_apk="dist/HariBrowser-2.3.0.apk"
          else
            cp "$unsigned" "dist/HariBrowser-2.3.0-unsigned.apk"
            echo "### Release signing: no stable key configured; unsigned validation artifact only" >> "$GITHUB_STEP_SUMMARY"
            echo "The artifact is an unsigned release build and cannot be installed until signed with a stable release key. Set the four HARI_RELEASE_* repository Actions secrets to sign it." >> "$GITHUB_STEP_SUMMARY"
            publish_apk="dist/HariBrowser-2.3.0-unsigned.apk"
          fi
          sha256sum "$publish_apk" | tee "$RUNNER_TEMP/SHA256SUMS.txt"
          echo "SHA-256: $(sha256sum "$publish_apk" | cut -d ' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish only the release APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hari-browser-2.3.0-release-apk
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
