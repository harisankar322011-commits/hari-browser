name: Build Hari Browser APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate each revision so a stalled older build cannot block the newest APK.
  group: hari-browser-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.6.0'
          # Avoid the separately licensed enhanced cache; use the open-source MIT cache provider.
          cache-provider: basic

      - name: Build debug and release APKs and run lint
        run: gradle --no-daemon clean assembleDebug assembleRelease lint

      - name: Verify debug APK exceeds 10 MiB
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk" || { echo "::error::Debug APK was not created."; exit 1; }
          bytes="$(stat -c '%s' "$apk")"
          echo "Debug APK size: $bytes bytes ($((bytes / 1048576)) MiB)"
          if [ "$bytes" -le 10485760 ]; then
            echo "::error::Debug APK must be larger than 10 MiB; got $bytes bytes."
            exit 1
          fi

      - name: Verify release APK was produced
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$apk" || { echo "::error::Release APK was not created."; exit 1; }
          bytes="$(stat -c '%s' "$apk")"
          echo "Release APK size: $bytes bytes ($((bytes / 1048576)) MiB)"
          echo "Release APK is unsigned; F-Droid builds and signs its own package."

      - name: Publish debug and release build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hari-browser-android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
