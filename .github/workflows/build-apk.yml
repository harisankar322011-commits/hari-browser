name: Build Hari Browser APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate each revision so a stalled older build cannot block the newest APK.
  group: hari-browser-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run repository security smoke checks
        run: python3 tools/security_smoke_test.py

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: '9.6.0'
          # Avoid the separately licensed enhanced cache; use the open-source MIT cache provider.
          cache-provider: basic

      - name: Build debug and release APKs and run lint
        run: gradle --no-daemon clean assembleDebug assembleRelease lint

      - name: Verify debug APK exceeds 10 MiB
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk" || { echo "::error::Debug APK was not created."; exit 1; }
          bytes="$(stat -c '%s' "$apk")"
          echo "Debug APK size: $bytes bytes ($((bytes / 1048576)) MiB)"
          if [ "$bytes" -le 10485760 ]; then
            echo "::error::Debug APK must be larger than 10 MiB; got $bytes bytes."
            exit 1
          fi

      - name: Validate APK signatures, package IDs and release manifest
        shell: bash
        run: |
          set -euo pipefail
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          apkanalyzer "manifest" "application-id" "$debug_apk" | grep -qx 'com.haricalcx.haribrowser.debug'
          apkanalyzer "manifest" "application-id" "$release_apk" | grep -qx 'com.haricalcx.haribrowser'
          debuggable="$(apkanalyzer manifest debuggable "$release_apk")"
          if [ "$debuggable" != "false" ]; then
            echo "::error::Release APK must not be debuggable (reported: $debuggable)."
            exit 1
          fi
          permissions="$(apkanalyzer manifest permissions "$release_apk" | sed '/^[[:space:]]*$/d' | sort -u)"
          if [ "$permissions" != "android.permission.INTERNET" ]; then
            echo "::error::Unexpected permissions in release APK:"
            printf '%s\n' "$permissions"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$debug_apk"
          unzip -tq "$debug_apk"
          unzip -tq "$release_apk"
          # Keep checksum paths relative to the extracted artifact root.
          (
            cd app/build/outputs/apk
            sha256sum debug/app-debug.apk release/app-release-unsigned.apk > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Verify release APK was produced
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$apk" || { echo "::error::Release APK was not created."; exit 1; }
          bytes="$(stat -c '%s' "$apk")"
          echo "Release APK size: $bytes bytes ($((bytes / 1048576)) MiB)"
          echo "Release APK is unsigned; F-Droid builds and signs its own package."

      - name: Publish debug and release build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hari-browser-android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
