import javax.tools.ToolProvider

plugins {
    id 'com.android.application'
}

def enableRustNativeBuild = providers.gradleProperty('enableRustNativeBuild').map { it.toBoolean() }.getOrElse(false)
def rustJniLibsDirectory = layout.buildDirectory.dir('generated/rust/jniLibs')

android {
    namespace 'com.haricalcx.haribrowser'
    compileSdk 36

    // AGP 9.x includes built-in Kotlin support; no separate kotlin-android plugin is needed.
    enableKotlin = true

    defaultConfig {
        applicationId 'com.haricalcx.haribrowser'
        minSdk 28
        targetSdk 36
        versionCode 8
        versionName '2.4.0'
    }

    sourceSets {
        main {
            // Empty in ordinary builds; populated by the opt-in cargo-ndk task.
            jniLibs.srcDir(rustJniLibsDirectory)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'com.google.zxing:core:3.5.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
}

/*
 * Bundle real, selectable offline home-screen wallpapers. The generator runs on
 * the build JVM only; java.awt is not packaged into the Android application.
 */
tasks.register('generateOfflineWallpapers') {
    inputs.file(file('../tools/WallpaperGenerator.java'))
    outputs.dir(file('src/main/assets/wallpapers'))

    doLast {
        def sourceFile = file('../tools/WallpaperGenerator.java')
        def classesDirectory = layout.buildDirectory.dir('wallpaper-generator/classes').get().asFile
        def outputDirectory = file('src/main/assets/wallpapers')
        classesDirectory.mkdirs()
        outputDirectory.mkdirs()

        def compiler = ToolProvider.getSystemJavaCompiler()
        if (compiler == null) {
            throw new GradleException('A full JDK is required to generate offline wallpapers.')
        }
        def compileResult = compiler.run(null, null, null,
                '-d', classesDirectory.absolutePath, sourceFile.absolutePath)
        if (compileResult != 0) {
            throw new GradleException('Offline wallpaper generator compilation failed.')
        }

        ant.java(classname: 'WallpaperGenerator', fork: true, failonerror: true) {
            classpath {
                pathelement(location: classesDirectory.absolutePath)
            }
            sysproperty(key: 'java.awt.headless', value: 'true')
            arg(value: outputDirectory.absolutePath)
        }
    }
}

/*
 * Rust is opt-in to protect existing builds until the native path passes CI
 * and real-device verification:
 * ./gradlew assembleDebug -PenableRustNativeBuild=true
 */
tasks.register('buildRustAndroid', Exec) {
    group = 'build'
    description = 'Build the experimental Rust URL classifier for Android via cargo-ndk.'
    onlyIf { enableRustNativeBuild }
    workingDir rootProject.file('rust/hari_url_guard')
    commandLine 'cargo', 'ndk',
            '-t', 'arm64-v8a',
            '-t', 'armeabi-v7a',
            '-t', 'x86_64',
            '-p', '28',
            '-o', rustJniLibsDirectory.get().asFile.absolutePath,
            'build', '--release'
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('generateOfflineWallpapers'))
    if (enableRustNativeBuild) {
        dependsOn(tasks.named('buildRustAndroid'))
    }
}
